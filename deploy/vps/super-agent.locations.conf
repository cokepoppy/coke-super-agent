# Include inside the existing codex.cokeagent.com TLS server block.
# The loopback-only VPS listener is an SSH reverse tunnel to Mac Vite Preview.
location = /super-agent { return 301 /super-agent/; }
location ^~ /super-agent/ {
    access_log /var/log/nginx/coke-super-agent.access.log super_agent;
    add_header X-Csa-Edge-Request-Id $request_id always;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /super-agent;
    proxy_set_header X-Csa-Edge-Request-Id $request_id;
    proxy_cookie_flags csa_session secure httponly samesite=lax;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Keep the URI so the Mac frontend receives /super-agent/... unchanged.
    proxy_pass http://127.0.0.1:14331;
}
